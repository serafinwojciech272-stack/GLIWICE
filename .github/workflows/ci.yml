name: Szpieg CI

on:
  push:
    branches: [main, "fix/extra-szpieg-core-engine-hardening"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke:persistence
      - run: npm run smoke:core-engine
      - run: npm run smoke:marketplaces
      - run: npm run smoke:marketplace-gateway
      - name: Production marketplace gateway smoke
        env:
          MARKETPLACE_GATEWAY_URL: https://extra-szpieg-api.onrender.com
        run: node scripts/marketplace-gateway-live-smoke.mjs
