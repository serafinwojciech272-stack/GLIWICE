name: Szpieg CI

on:
  push:
    branches: [main, "fix/extra-szpieg-core-engine-hardening"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke:persistence
